[workspace]
resolver = "2"
members = ["crates/devpanel-core", "crates/devpanel-infra", "apps/devpanel"]
# bones is its own workspace; it is built as a path dependency, never as a member.
exclude = ["vendor/bones"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SDL3 builds from source; a Debug SDL links the debug CRT on Windows while
# rustc always links the release one. Building it optimised avoids the clash
# (same stanza as bones and commits use).
[profile.dev.package.sdl3-sys]
opt-level = 2
debug = false

[profile.dev]
debug = 0

# Release binaries ship without symbols; it roughly halves their size.
[profile.release]
strip = true
